; =============================================================================
; platformio.ini — Root configuration (satu-satunya yang dipakai)
; =============================================================================
;
; Jalankan dari root project:
;   pio run -e node_sensor_a -t upload
;   pio run -e node_sensor_b -t upload
;   pio run -e node_gateway   -t upload
;
; CATATAN STRUKTUR:
;   src_dir     = src       (main.cpp, task_*.cpp)
;   include_dir = include   (Config.h, DataModels.h, dst.)
;   lib_dir     = lib       (EspNowMesh, HealthSensors, dst.)
;
; Hapus atau pindahkan file-file lama di root src/ dan include/ yang sudah
; tidak dipakai (src/task_cs_sender.cpp lama, include/Config.h lama, dst.)
; =============================================================================

[platformio]
src_dir     = src
include_dir = include
lib_dir     = lib

[env]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1

; ---------------------------------------------------------------------------
; PENTING: Nonaktifkan CS model yang tidak dipakai untuk mencegah
; redefinisi CSEncoder dan CSPhiMatrix.
;
; Default aktif: CS_Model_Gaussian (Hadamard + OMP)
; Untuk ganti ke LASSO: tukar nilai lib_ignore di bawah.
; ---------------------------------------------------------------------------
lib_ignore = CS_Model_Lasso


; ---------------------------------------------------------------------------
; Node A — Sensor 1
; ---------------------------------------------------------------------------
[env:node_sensor_a]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR
    -DNODE_ID=1

; ---------------------------------------------------------------------------
; Node B — Sensor 2
; ---------------------------------------------------------------------------
[env:node_sensor_b]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR
    -DNODE_ID=2

; ---------------------------------------------------------------------------
; Node C — Gateway
; ---------------------------------------------------------------------------
[env:node_gateway]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_GATEWAY
    -DNODE_ID=3