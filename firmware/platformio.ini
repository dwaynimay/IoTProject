; =============================================================================
; platformio.ini 
; =============================================================================
;
; CATATAN STRUKTUR:
;   src_dir     = src       (main.cpp, task_*.cpp)
;   include_dir = include   (Config.h, DataModels.h, dst.)
;   lib_dir     = lib       (EspNowMesh, HealthSensors, dst.)
;
; =============================================================================

[platformio]
src_dir     = src
include_dir = include
lib_dir     = lib

[env]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
lib_ldf_mode  = deep+

lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1

; ---------------------------------------------------------------------------
; PENTING: Nonaktifkan CS model yang tidak dipakai untuk mencegah
; redefinisi CSEncoder dan CSPhiMatrix.
;
; Default aktif: CS_Model_Gaussian (Hadamard + OMP)
; Untuk ganti ke LASSO: tukar nilai lib_ignore di bawah.
; ---------------------------------------------------------------------------
lib_ignore = CS_Model_Lasso


; ---------------------------------------------------------------------------
; Node A — Sensor IMU
; ---------------------------------------------------------------------------
[env:node_imu]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR_IMU
    -DNODE_ID=1

; ---------------------------------------------------------------------------
; Node B — Sensor PPG
; ---------------------------------------------------------------------------
[env:node_ppg]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR_PPG
    -DNODE_ID=2
    ; =========================================================================
    ; TOGGLE PPG (FINGER vs WRIST)
    ; Hapus tanda titik koma (;) di baris bawah ini untuk menggunakan FINGER
    ; Tambahkan tanda titik koma (;) untuk kembali menggunakan WRIST
    ; =========================================================================
    ; -DUSE_PPG_FINGER

; ---------------------------------------------------------------------------
; Node C — Gateway
; ---------------------------------------------------------------------------
[env:node_gateway]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_GATEWAY
    -DNODE_ID=3

; ---------------------------------------------------------------------------
; TEST ISOLASI: PPG
; ---------------------------------------------------------------------------
[env:test_ppg]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR_PPG
    -DNODE_ID=2
    -DUSE_PPG_FINGER
build_src_filter = +<../test_sketches/test_ppg.cpp> -<*>

; ---------------------------------------------------------------------------
; TEST ISOLASI: IMU
; ---------------------------------------------------------------------------
[env:test_imu]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR_IMU
    -DNODE_ID=1
build_src_filter = +<../test_sketches/test_imu.cpp> -<*>

; ---------------------------------------------------------------------------
; TEST ISOLASI: CS Compression
; ---------------------------------------------------------------------------
[env:test_cs_compression]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR_IMU
    -DNODE_ID=1
build_src_filter = +<../test_sketches/test_cs_compression.cpp> -<*>

; ---------------------------------------------------------------------------
; TEST ISOLASI: MESH SENSOR NODE 1 (Sender / Dipaksa Relay)
; ---------------------------------------------------------------------------
[env:test_mesh_sensor_n1]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR_IMU
    -DNODE_ID=1
    -DFORCE_RELAY_TEST
build_src_filter = +<../test_sketches/manual_mesh_routing.cpp> -<*>

; ---------------------------------------------------------------------------
; TEST ISOLASI: MESH SENSOR NODE 2 (Forwarder)
; ---------------------------------------------------------------------------
[env:test_mesh_sensor_n2]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR_PPG
    -DNODE_ID=2
build_src_filter = +<../test_sketches/manual_mesh_routing.cpp> -<*>

; ---------------------------------------------------------------------------
; TEST ISOLASI: MESH GATEWAY
; ---------------------------------------------------------------------------
[env:test_mesh_gateway]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_GATEWAY
    -DNODE_ID=3
build_src_filter = +<../test_sketches/manual_mesh_routing.cpp> -<*>

; ---------------------------------------------------------------------------
; TEST ISOLASI: RAW VS CS IMU
; ---------------------------------------------------------------------------
[env:test_imu_raw_vs_cs]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR_IMU
    -DNODE_ID=1
build_src_filter = +<../test_sketches/test_imu_raw_vs_cs.cpp> -<*>

; ---------------------------------------------------------------------------
; STANDALONE: DIRECT MQTT IMU RECORDER
; ---------------------------------------------------------------------------
[env:record_imu]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=ROLE_SENSOR_IMU
    -DNODE_ID=1
build_src_filter = +<../test_sketches/record_imu.cpp> -<*>